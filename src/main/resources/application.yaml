spring:
  application:
    name: spring-boot-bank-manager
  jackson:
    serialization:
      indent-output: true

server:
  port: 8081
  error:
    include-message: always # just for development purposes
    include-binding-errors: always # just for development purposes

security:
  master-key: ${MASTER_KEY}
  jwt:
    secret: ${JWT_SECRET} # must be 32+ chars
    expirationMs: 3600000 # 1 hour access token
    refreshExpirationMs: 604800000 # 7 days refresh token

logging:
  level:
    root: info
    org.springframework.web: debug
    com.bank.manager: debug